name: "Main"
on:
  - push

jobs:
  configure:
    runs-on: ubuntu-latest
    outputs:
      uid_gid: ${{ steps.get-user.outputs.uid_gid }}
      datetime: ${{ steps.get-datetime.outputs.datetime }}
    steps:
      - id: get-user
        run: echo "uid_gid=$(id -u):$(id -g)" >> $GITHUB_OUTPUT
      - id: get-datetime
        run: echo "datetime=$(date +'%Y%m%d%H%M%S')" >> $GITHUB_OUTPUT

  build:
    needs: [configure]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install node
        uses: actions/setup-node@v4
        with:
          # @zondax/ledger-js 2.0.0 requires Node 20+. Matches .mise.toml.
          node-version: 22
      - name: Install dependencies
        run: yarn install
      - name: Run linter
        run: yarn lint
      - name: Check formatting
        run: yarn format:check
      - name: Build
        run: yarn build
      - name: Run tests
        run: yarn test
